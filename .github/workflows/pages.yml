name: pages

on:
  workflow_dispatch:
  schedule:
    # Nightly UTC — refresh static catalog site
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/site/**"
      - "src/catalog/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Sync registry snapshot (bounded)
        run: npx tsx src/cli.ts catalog sync --max-pages 1
        env:
          MCP_FLOW_CATALOG_DIR: catalog
      - name: Enrich catalog (README + tools/list)
        # ~100 latest servers per page; soft-fails OK. Raise max-pages later carefully.
        run: |
          npm run factory:enqueue-enrich -- --all --limit 500
          for i in $(seq 1 120); do
            pending=$(node -e "
              const fs=require('fs'),path=require('path');
              const d='scripts/factory/.jobs/queue';
              if(!fs.existsSync(d)){console.log(0);process.exit(0)}
              let n=0;
              for (const f of fs.readdirSync(d).filter(x=>x.endsWith('.json'))) {
                const j=JSON.parse(fs.readFileSync(path.join(d,f),'utf8'));
                if(j.status==='pending'||j.status==='running') n++;
              }
              console.log(n);
            ")
            echo "enrich remaining=$pending"
            if [ "$pending" -eq 0 ]; then break; fi
            npx tsx scripts/factory/queue-worker.ts --once --concurrency 5
          done
          cat catalog/meta.json
      - name: Build static site
        run: npm run site:build
        env:
          SITE_BASE: /mcp-flow
          SITE_ORIGIN: https://real-limitless.github.io
          SITE_REPO: https://github.com/real-limitless/mcp-flow
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
