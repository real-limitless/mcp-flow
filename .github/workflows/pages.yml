name: pages

on:
  push:
    branches: [CORE]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/catalog
          cp -a site/. _site/
          if git ls-remote --exit-code --heads origin catalog-data >/dev/null 2>&1; then
            git fetch origin catalog-data --depth=1
            rm -rf /tmp/cd && mkdir -p /tmp/cd
            git archive origin/catalog-data | tar -x -C /tmp/cd
            cp -a /tmp/cd/. _site/catalog/ 2>/dev/null || cp -a /tmp/cd/catalog/. _site/catalog/ || true
            echo "catalog-data loaded"
          else
            echo "No catalog-data yet"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
