name: pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [catalog-build]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/site/**"
      - ".github/workflows/pages.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Load catalog from catalog-data branch
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p catalog/entries
          if git ls-remote --exit-code --heads origin catalog-data >/dev/null 2>&1; then
            git fetch origin catalog-data --depth=1
            rm -rf /tmp/cd && mkdir -p /tmp/cd
            git archive origin/catalog-data | tar -x -C /tmp/cd
            cp -a /tmp/cd/. catalog/
            echo "catalog-data loaded"
            cat catalog/meta.json || true
            ls catalog/entries | wc -l
          else
            echo "No catalog-data yet — empty catalog shell"
          fi

      - name: Build static site (JSON shell)
        run: npm run site:build
        env:
          SITE_BASE: /mcp-flow
          SITE_ORIGIN: https://real-limitless.github.io
          SITE_REPO: https://github.com/real-limitless/mcp-flow
          CATALOG_DIR: catalog

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
