# DEV stack only. Mounted by mcp-flow-dev-traefik.
# JSON access log for this process. API and dashboard are omitted, so they
# stay off. websecure is the only proxy entrypoint. ping listens on the
# container loopback for the healthcheck.

log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.json
  format: json
  fields:
    names:
      ClientUsername: drop
    headers:
      defaultMode: drop

entryPoints:
  websecure:
    address: ":8443"
    http:
      tls: {}
  ping:
    address: "127.0.0.1:8082"

ping:
  entryPoint: ping

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true
