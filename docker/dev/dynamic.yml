# DEV stack only. Forwards the internal TLS entrypoint to the DEV gateway.
# No host rule, so no hostname is baked in.

http:
  routers:
    mcp-flow-dev:
      entryPoints:
        - websecure
      rule: "PathPrefix(`/`)"
      service: mcp-flow-dev
      tls: {}
  services:
    mcp-flow-dev:
      loadBalancer:
        servers:
          - url: "http://mcp-flow-dev:8787"
