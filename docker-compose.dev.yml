# Second gateway, isolated from docker-compose.yml.
#
# Build the gateway on the host from a git commit. Do not set a registry
# image for it. From this repo:
#   docker compose --env-file .env.dev -f docker-compose.dev.yml up --build -d
#
# Interpolation uses MCP_FLOW_DEV_* and TS_DEV_* (see .env.dev.example) so a
# sibling .env for the other stack cannot supply its secrets, origin, or
# tailnet identity. Pass --env-file .env.dev. On Dokploy, set those variables
# on this app and build from the git commit.
#
# No host ports. By default every service joins only the network named
# mcp-flow-dev. Stop this project before starting it again.
# One process uses /data/mcp-flow.db on the volume named mcp-flow-dev-data.
#
# The gateway service is docker/dev/gateway.yml. A non-empty
# MCP_FLOW_DEV_PUBLIC_HOST (hostname only) includes
# docker/dev/gateway-public.yml instead, which extends that service onto the
# external Dokploy network and adds host-Traefik labels. Unset or empty keeps
# the tailnet-only stack: no Dokploy network and no Traefik labels.
# mcp-flow-dev-traefik and mcp-flow-dev-tailscale stay as they are either way.
#
# After boot, create project slug mcp_flow_dev in Admin. Day-1 backends are
# echo and health only. This file does not register backends, does not start
# an edge agent, and does not mount a container socket.
#
# What the process actually reads (checked in src when this file was added):
# - requireSecrets() in src/config.ts rejects only an empty master key or
#   admin token. It does not read ENVIRONMENT and does not reject a
#   change-me* value. ENVIRONMENT is staging so the variable is set.
# - MCP_FLOW_REFUSE_LEGACY_MCP_KEYS, MCP_FLOW_CORS_ORIGINS, and
#   MCP_FLOW_LOCK_PATH are not read. CORS is origin "*" in src/api/app.ts.
#   SQLite WAL files are created beside the db file. No lock file is taken.
# - MCP_FLOW_ALLOW_PRIVATE_URLS is read. The code default is false. The
#   gateway fragment sets false. docker-compose.yml defaults that variable to true.
# - resolveRedirectUri() in src/oauth/origin.ts uses the origin of
#   MCP_FLOW_PUBLIC_URL plus /oauth/callback. Keep an https origin, no path.

name: mcp-flow-dev

# Compose include cannot merge into a service defined in this file. The
# gateway therefore lives in a fragment, and this path picks the fragment.
# ${VAR:+-public} is "-public" only when the host is non-empty.
include:
  - path: ./docker/dev/gateway${MCP_FLOW_DEV_PUBLIC_HOST:+-public}.yml

services:
  mcp-flow-dev-bootstrap:
    build:
      context: .
      target: gateway
    image: mcp-flow-dev:local
    container_name: mcp-flow-dev-bootstrap
    restart: "no"
    depends_on:
      mcp-flow-dev:
        condition: service_healthy
    env_file:
      - path: .env.dev
        required: false
    environment:
      ENVIRONMENT: staging
      MCP_FLOW_MASTER_KEY: ${MCP_FLOW_DEV_MASTER_KEY:-}
      MCP_FLOW_ADMIN_TOKEN: ${MCP_FLOW_DEV_ADMIN_TOKEN:-}
      MCP_FLOW_INTERNAL_URL: http://mcp-flow-dev:8787
      MCP_FLOW_PUBLIC_URL: "${MCP_FLOW_DEV_PUBLIC_URL:-https://mcp-flow-dev.example.com}"
      MCP_FLOW_DATA_DIR: /data
    volumes:
      - mcp-flow-dev-data:/data
    command: ["bootstrap"]
    networks:
      - mcp-flow-dev

  mcp-flow-dev-traefik:
    image: traefik:v3.7.16
    container_name: mcp-flow-dev-traefik
    restart: unless-stopped
    depends_on:
      mcp-flow-dev:
        condition: service_healthy
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./docker/dev/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/dev/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - mcp-flow-dev-traefik-logs:/var/log/traefik
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/traefik",
          "healthcheck",
          "--ping",
          "--configFile=/etc/traefik/traefik.yml",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - mcp-flow-dev

  mcp-flow-dev-tailscale:
    image: tailscale/tailscale:stable
    container_name: mcp-flow-dev-tailscale
    restart: unless-stopped
    depends_on:
      mcp-flow-dev-traefik:
        condition: service_healthy
    environment:
      TS_AUTHKEY: ${TS_DEV_AUTHKEY:-}
      TS_HOSTNAME: ${TS_DEV_HOSTNAME:-mcp-flow-dev}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/ts-serve.json
      TS_EXTRA_ARGS: "--login-server=${TS_DEV_LOGIN_SERVER:-https://headscale.example.com} ${TS_DEV_EXTRA_ARGS:-}"
    volumes:
      - mcp-flow-dev-tailscale-state:/var/lib/tailscale
      - ./docker/dev:/config:ro
    networks:
      - mcp-flow-dev

networks:
  mcp-flow-dev:
    name: mcp-flow-dev

volumes:
  mcp-flow-dev-data:
    name: mcp-flow-dev-data
  mcp-flow-dev-tailscale-state:
    name: mcp-flow-dev-tailscale-state
  mcp-flow-dev-traefik-logs:
    name: mcp-flow-dev-traefik-logs
