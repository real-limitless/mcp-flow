<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mcp-flow admin</title>
  <meta name="description" content="Self-hosted mcp-flow gateway operator console." />
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">mcp<span>-flow</span></div>
      </div>
      <div class="meta-pills">
        <span class="pill accent">Admin</span>
        <span class="pill vault">Sealed</span>
        <span class="pill on">Local</span>
      </div>
    </header>

    <section class="hero-admin">
      <p class="eyebrow">Operator console · gateway vault</p>
      <h1 class="display">Workspace control.<br /><em>Keys stay sealed.</em></h1>
      <p class="lede">
        Manage agent keys, upstream backends, edge devices, and tool-call audit —
        same chassis as the public catalog, wired to this gateway.
      </p>
    </section>

    <div class="nav-bar">
      <nav class="seg tabs" aria-label="Admin sections">
        <button type="button" data-tab="status" class="seg-btn active">Status</button>
        <button type="button" data-tab="keys" class="seg-btn">Keys</button>
        <button type="button" data-tab="backends" class="seg-btn">Backends</button>
        <button type="button" data-tab="devices" class="seg-btn">Devices</button>
        <button type="button" data-tab="audit" class="seg-btn">Audit</button>
      </nav>
      <div class="auth-row">
        <input id="token" type="password" placeholder="Admin token" autocomplete="off" />
        <button id="saveToken" type="button" class="pill-btn primary">Save</button>
        <button id="refresh" type="button" class="pill-btn ghost">Refresh</button>
      </div>
    </div>

    <main class="panel-stack">
      <section id="tab-status" class="panel active"></section>
      <section id="tab-keys" class="panel"></section>
      <section id="tab-backends" class="panel"></section>
      <section id="tab-devices" class="panel"></section>
      <section id="tab-audit" class="panel"></section>
    </main>
  </div>
  <p id="err" class="err" hidden></p>
  <script src="/admin/app.js"></script>
</body>
</html>
