<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mcp-flow · sign in</title>
  <link rel="stylesheet" href="/admin/styles.css" />
</head>
<body>
  <div class="shell auth-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">mcp<span>-flow</span></div>
      </div>
      <div class="meta-pills">
        <span class="pill accent">Operator</span>
      </div>
    </header>
    <section class="hero-admin">
      <p class="eyebrow">Workspace login</p>
      <h1 class="display">Sign in.<br /><em>Keys stay sealed.</em></h1>
      <p class="lede">This login is local to this mcp-flow instance. It is not shared with other Flow products.</p>
    </section>
    <form id="form" class="surface auth-card">
      <div class="panel-head"><span class="title">Sign in</span></div>
      <div class="panel-pad">
        <label class="form-field">
          <span class="field-label">Email</span>
          <input id="email" type="email" autocomplete="username" required />
        </label>
        <label class="form-field">
          <span class="field-label">Password</span>
          <input id="password" type="password" autocomplete="current-password" required />
        </label>
        <p id="err" class="err" hidden></p>
        <button type="submit" class="pill-btn primary">Sign in</button>
      </div>
    </form>
  </div>
  <script>
    (async () => {
      const st = await fetch("/v1/auth/status").then((r) => r.json());
      if (st.setupRequired) location.replace("/admin/setup.html");
      if (st.authenticated) location.replace("/admin/");
    })();
    const err = document.getElementById("err");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      err.hidden = true;
      const res = await fetch("/v1/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        err.hidden = false;
        err.textContent = body.error || "Sign in failed";
        return;
      }
      location.replace("/admin/");
    });
  </script>
</body>
</html>
