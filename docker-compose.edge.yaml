# Edge agent only. Connects to an existing mcp-flow server.
# Set MCP_FLOW_URL and MCP_FLOW_DEVICE_TOKEN before starting.
# Do not put real tokens or server addresses in this file.

name: mcp-flow-edge

services:
  edge:
    build:
      context: .
      target: edge
    image: mcp-flow-edge:local
    container_name: mcp-flow-edge
    restart: unless-stopped
    user: "0:0"
    healthcheck:
      disable: true
    environment:
      MCP_FLOW_DATA_DIR: /data
      MCP_FLOW_URL: ${MCP_FLOW_URL:?Set MCP_FLOW_URL to the mcp-flow server base URL}
      MCP_FLOW_DEVICE_TOKEN: ${MCP_FLOW_DEVICE_TOKEN:?Set MCP_FLOW_DEVICE_TOKEN to the enrolled device token}
      MCP_FLOW_CONTAINER_RUNTIME: ${MCP_FLOW_CONTAINER_RUNTIME:-docker}
      MCP_FLOW_EDGE_NAME: ${MCP_FLOW_EDGE_NAME:-edge}
    volumes:
      - mcp-flow-edge-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - mcp-flow-repos:/repos
      - mcp-flow-gh:/root/.config/gh
    command:
      - edge
      - --url
      - ${MCP_FLOW_URL:?Set MCP_FLOW_URL to the mcp-flow server base URL}
      - --name
      - ${MCP_FLOW_EDGE_NAME:-edge}

volumes:
  mcp-flow-edge-data:
  mcp-flow-repos:
  mcp-flow-gh:
