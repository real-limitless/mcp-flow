services:
  mcp-flow:
    build: .
    ports:
      - "${MCP_FLOW_PORT:-8787}:8787"
    environment:
      MCP_FLOW_MASTER_KEY: ${MCP_FLOW_MASTER_KEY:?set MCP_FLOW_MASTER_KEY}
      MCP_FLOW_ADMIN_TOKEN: ${MCP_FLOW_ADMIN_TOKEN:?set MCP_FLOW_ADMIN_TOKEN}
      MCP_FLOW_HOST: 0.0.0.0
      MCP_FLOW_PORT: "8787"
      MCP_FLOW_DB_PATH: /data/mcp-flow.db
      MCP_FLOW_ALLOW_PRIVATE_URLS: ${MCP_FLOW_ALLOW_PRIVATE_URLS:-false}
      MCP_FLOW_WORKSPACE_NAME: ${MCP_FLOW_WORKSPACE_NAME:-default}
      MCP_FLOW_CONTAINER_RUNTIME: ${MCP_FLOW_CONTAINER_RUNTIME:-docker}
    volumes:
      - mcp-flow-data:/data
      # Uncomment for central-sandbox OCI on the host docker:
      # - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  mcp-flow-data:
